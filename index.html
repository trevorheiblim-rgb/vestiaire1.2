<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vestiaire WFP Walkthrough</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Inter:wght@400;500;600;700&family=Nunito:wght@700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#1e1e1e; --grey:#656565; --grey2:#8a8a8a; --line:#e0e0e0; --soft:#f5f6f8; --panel:#fafafa;
  --red:#c93730; --lav:#f1f0f9; --auth:#f4f8fe; --authline:#dce7fb; --banner:#eae6dc; --promo:#edfbd8;
  --sans:"HelveticaNowText","Helvetica Now Text","Helvetica Neue",Helvetica,Inter,Arial,sans-serif;
  --serif:"Albra-Regular","Albra","DM Serif Display",Georgia,serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#d9d6cf}
body{font-family:var(--sans);color:var(--ink);font-size:16px;line-height:1.4;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
a{color:inherit;text-decoration:none;cursor:pointer}
u{text-underline-offset:2px}
#canvas{width:1440px;min-height:100vh;background:#fff;margin:0 auto;padding-bottom:110px;position:relative}
.serif{font-family:var(--serif);font-weight:400}
.muted{color:var(--grey)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:#000;color:#fff;border:1px solid #000;border-radius:2px;font-size:17px;font-weight:500;padding:14px 24px}
.btn.out{background:#fff;color:#000}
.btn.dis{background:#c8c8c8;border-color:#c8c8c8;color:#fff;cursor:default}
.btn.full{width:100%}
.ico{display:inline-block;vertical-align:middle}
.row{display:flex;justify-content:space-between;align-items:baseline;gap:12px}

/* header */
.topbanner{background:var(--banner);text-align:center;font-size:14px;font-weight:500;padding:9px 0}
.hdr{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:14px 36px}
.search{width:400px;background:#f3f3f3;border-radius:22px;padding:10px 16px;display:flex;gap:10px;align-items:center;font-size:15px;color:#3a3a3a}
.logo img{height:30px;display:block}
.hright{justify-self:end;display:flex;align-items:center;gap:28px}
.hright .sell{background:#000;color:#fff;font-size:15px;font-weight:500;padding:9px 16px;border-radius:1px}
.avatar{width:30px;height:30px;border-radius:50%;background:#8e8e8e;position:relative;overflow:hidden;display:inline-block}
.avatar:before{content:"";position:absolute;width:12px;height:12px;border-radius:50%;background:#fff;left:9px;top:6px}
.avatar:after{content:"";position:absolute;width:22px;height:14px;border-radius:50% 50% 0 0;background:#fff;left:4px;top:21px}
.badge{position:absolute;top:-6px;right:-7px;background:#d62b2b;color:#fff;font-size:9px;border-radius:50%;width:14px;height:14px;display:grid;place-items:center}
.nav{display:flex;gap:31px;padding:13px 36px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);font-size:15.5px}
.nav .sale{color:var(--red)}
.cohdr{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:16px 180px;border-bottom:1px solid var(--line)}
.cohdr .sec{font-size:14px;color:var(--grey);display:flex;gap:8px;align-items:center}

/* home */
.promo{background:var(--promo);margin:22px 18px 0;padding:22px 38px;position:relative}
.promo h2{font-family:var(--serif);font-weight:400;font-size:38px;line-height:1.1}
.promo p{font-size:17px;margin-top:8px}
.h-xl{font-family:var(--serif);font-weight:400;font-size:44px;margin:62px 36px 22px}
.tiles{display:grid;grid-template-columns:repeat(5,1fr);gap:15px;padding:0 36px}
.tile img{width:100%;aspect-ratio:1;object-fit:cover;display:block;background:#f6f6f6}
.tile div{text-align:center;font-size:14px;letter-spacing:.18em;margin-top:24px}

/* plp */
.crumbs{font-size:15px;color:var(--grey);display:flex;gap:10px;align-items:center}
.plp{padding:28px 56px}
.chips{display:flex;gap:8px;margin:20px 0}
.chip{border:1px solid var(--line);border-radius:30px;padding:5px 16px 5px 6px;display:flex;gap:10px;align-items:center;font-size:15px}
.chip img{width:36px;height:36px;object-fit:contain}
.filters{display:flex;gap:8px;align-items:center}
.filters span{border:1px solid #000;padding:10px 12px;font-size:15px}
.grid{display:grid;grid-template-columns:repeat(5,1fr);border:1px solid var(--line);border-right:0;margin-top:22px}
.card{border-right:1px solid var(--line);padding:14px 14px 18px;position:relative}
.card .img{aspect-ratio:1/0.9;display:grid;place-items:center;background:#fff}
.card img{width:100%;height:100%;object-fit:contain}
.card .tag{display:inline-block;border:1px solid #bbb;font-size:9.5px;font-weight:700;padding:2px 6px;margin-top:6px}
.card .br{font-size:13px;font-weight:700;margin-top:8px;text-transform:uppercase}
.card .nm{font-size:13px;color:var(--ink)}
.card .pr{font-size:13px;margin-top:4px}
.heart{position:absolute;right:14px;bottom:44px}

/* pdp */
.pdp{background:linear-gradient(90deg,#fff 50%,var(--soft) 50%);padding:30px 0 50px}
.pdp .crumbs{justify-content:center;font-size:12.5px}
.pdp-title{text-align:center;margin-top:30px}
.pdp-title .b{font-family:var(--serif);font-size:72px;line-height:1}
.pdp-title .n{font-size:17px;margin-top:16px}
.pdp-grid{display:grid;grid-template-columns:720px 720px;margin-top:20px}
.gal{display:grid;grid-template-columns:60px 1fr;gap:24px;padding:0 40px 0 36px}
.thumbs{display:flex;flex-direction:column;gap:9px;margin-top:70px}
.thumbs div{width:48px;height:48px;border:1px solid transparent;cursor:pointer;background:#fff}
.thumbs div.on{border-color:#000}
.thumbs img{width:100%;height:100%;object-fit:cover;display:block}
.main{aspect-ratio:1;display:grid;place-items:center;background:#fff;position:relative}
.main img{width:100%;height:100%;object-fit:contain}
.likes{position:absolute;top:-28px;left:50%;transform:translateX(-50%);display:flex;gap:8px;align-items:center;font-size:15px}
.buy{padding:30px 56px 0 112px}
.price{font-size:22px;display:flex;align-items:center;gap:6px}
.price s{color:var(--ink)}
.price .now{color:var(--red)}
.buy .ln{font-size:15.5px;margin-top:4px}
.buy .cond{font-size:19px;margin-top:20px}
.buy .cond span{font-size:15px;color:var(--grey);margin-left:6px}
.buy .col{font-size:19px;margin-top:6px}
.lister{position:absolute;right:0;top:0;text-align:center;font-size:13.5px;color:var(--grey)}
.lister .avatar{width:58px;height:58px;display:block;margin:0 auto 8px}
.lister .avatar:before{width:22px;height:22px;left:18px;top:11px}
.lister .avatar:after{width:40px;height:26px;left:9px;top:38px}
.offer{background:var(--lav);padding:17px 18px;font-size:15.5px;font-style:italic;margin-top:22px}
.ctas{display:grid;grid-template-columns:1.6fr 1fr .6fr;gap:14px;margin-top:22px}
.ctas .btn{padding:15px 10px}
.meta{display:flex;gap:16px;align-items:center;font-size:14.5px;color:var(--grey);margin-top:16px}
.meta u{color:var(--grey)}
/* WFP on PDP: same footprint as the offer box */
.wfp-pdp{display:flex;align-items:center;gap:12px;border:1px solid var(--line);background:#fff;padding:16px 18px;margin-top:14px;font-size:14.5px;color:var(--grey);line-height:1.35}
.wfp-pdp img{width:24px;height:24px;flex:none}
.wfp-pdp b{color:var(--ink);font-weight:500}
.wfp-pdp .lm{color:var(--ink);text-decoration:underline;text-underline-offset:2px;cursor:pointer;white-space:nowrap}
.pby{font-family:Nunito,sans-serif;font-size:8.5px;font-weight:700;color:#565656;white-space:nowrap}
.details{padding:40px 36px 10px;max-width:900px}
.details h2{font-family:var(--serif);font-weight:400;font-size:34px;margin-bottom:10px}
.details .cap{font-size:13px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;margin:20px 0 6px}
.dl{display:grid;grid-template-columns:160px 1fr;gap:6px 16px;font-size:15px}
.dl div:nth-child(odd){color:var(--grey)}

/* drawer */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:50}
.drawer{position:fixed;top:0;right:0;bottom:0;width:420px;background:#fff;z-index:51;padding:28px;overflow:auto}
.drawer h3{font-family:var(--serif);font-weight:400;font-size:28px;margin-bottom:18px}

/* checkout */
.co{display:grid;grid-template-columns:1fr 590px;min-height:820px}
.co-left{padding:52px 60px 60px 180px}
.co-right{background:var(--panel);padding:52px 120px 60px 46px}
.step{border-bottom:1px solid var(--line);padding:30px 0}
.step:first-child{padding-top:0}
.step h2{font-size:24px;font-weight:500}
.step.off h2{color:#8a8a8a}
.step .sumrow{display:grid;grid-template-columns:200px 1fr auto;gap:12px;align-items:start}
.step .edit{display:flex;gap:6px;align-items:center;font-size:16px;font-weight:500}
.seller{display:flex;align-items:center;gap:16px;padding:18px 0;border-bottom:1px solid var(--line);margin-top:14px}
.seller .avatar{width:42px;height:42px}
.seller .avatar:before{width:16px;height:16px;left:13px;top:8px}.seller .avatar:after{width:30px;height:18px;left:6px;top:28px}
.item{display:grid;grid-template-columns:96px 1fr auto;gap:16px;padding:22px 0 18px}
.item img{width:96px;height:62px;object-fit:contain}
.item .br{font-size:14px;font-weight:700}
.item .nm{font-size:15px;color:var(--grey);line-height:1.5}
/* checkout add-on boxes: WFP matches Authentication box exactly */
.addon{background:var(--auth);border:1px solid var(--authline);border-radius:5px;padding:16px 18px 14px;margin-top:12px}
.addon .t{display:flex;gap:9px;align-items:center;font-size:17px;font-weight:500}
.addon .t img{width:20px;height:20px}
.addon .d{font-size:15.5px;color:var(--grey);margin-top:4px}
.addon .d u{color:var(--ink);cursor:pointer}
.addon .f{display:flex;justify-content:space-between;align-items:center;margin-top:10px;font-size:15px}
.addon .i{margin-left:auto}
.tog{width:44px;height:26px;border-radius:13px;background:#fff;border:1px solid #bbb;position:relative;flex:none;transition:.15s}
.tog:after{content:"";position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.35);transition:.15s}
.tog.on{background:#000;border-color:#000}.tog.on:after{left:20px}
.ship-box{border:1px solid #c9c9c9;margin-top:22px}
.ship-box .hd{background:#f5f5f5;padding:18px 22px;display:flex;align-items:center;gap:10px;font-weight:500}
.ship-box .bd{padding:24px 22px;display:flex;justify-content:space-between;font-size:15px;line-height:1.6}
.radio{width:18px;height:18px;border-radius:50%;border:1.5px solid #555;display:inline-grid;place-items:center;flex:none}
.radio.on{border-color:#000}.radio.on:after{content:"";width:10px;height:10px;border-radius:50%;background:#000}
.pm{border:1px solid #bbb}
.pm div{display:flex;align-items:center;gap:14px;padding:16px 20px;border-bottom:1px solid #bbb;font-size:16px;cursor:pointer}
.pm div:last-child{border-bottom:0}
.pm img{height:22px;margin-left:auto}
.sum h3{font-size:18px;font-weight:500;margin-bottom:24px}
.sum .row{font-size:17px;margin:10px 0}
.sum .sub{font-size:15px;color:var(--grey)}
.sum .wf{color:var(--ink)}
.promo-in{border:1px solid #c9c9c9;background:#fff;padding:13px 16px;font-size:15.5px;color:#888;margin:6px 0 6px}
.sum .tot{border-top:1px solid var(--line);padding-top:22px;margin-top:22px;font-weight:600;font-size:17.5px}
.legal{font-size:12.5px;color:var(--grey);margin-top:14px;line-height:1.55}
.legal u{color:var(--grey)}
.trust{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--line);padding:30px 80px}
.trust div{display:flex;gap:14px;align-items:center;font-size:14.5px}
.trust b{display:block;font-weight:500}
.trust span{color:var(--grey)}

/* generic page blocks */
.wrap{width:1100px;margin:0 auto;padding:44px 0 60px}
.h1{font-family:var(--serif);font-weight:400;font-size:44px;line-height:1.1;margin-bottom:10px}
.h2{font-family:var(--serif);font-weight:400;font-size:28px;margin-bottom:10px}
.box{border:1px solid var(--line);padding:22px}
.mail{border:1px solid #dcdcdc}
.mail .mh{background:#f2f2f2;padding:10px 20px;font-size:12.5px;color:#444;line-height:1.6}
.mail .mb{width:600px;margin:0 auto;padding:34px 0 40px}
.lines .row{font-size:15px;padding:5px 0}
.lines .row.t{border-top:1px solid #eee;padding-top:12px;margin-top:6px;font-weight:600}
/* Seel notice blocks in Vestiaire style */
.seelbox{border:1px solid var(--line);padding:16px 18px;margin-top:18px;background:#fff}
.seelbox.tint{background:var(--soft)}
.seelbox .h{display:flex;gap:10px;align-items:center;font-size:15.5px;font-weight:600}
.seelbox .h img{width:22px;height:22px}
.seelbox p{font-size:14px;color:var(--grey);line-height:1.55;margin-top:6px}
.seelbox .ft{display:flex;justify-content:space-between;align-items:center;margin-top:10px;font-size:11px;color:#a4a5a5}
.seelpill{display:inline-flex;gap:6px;align-items:center;font-size:12.5px;font-weight:500;background:var(--soft);border:1px solid var(--line);padding:4px 10px;border-radius:2px}
.seelpill img{width:16px;height:16px}
.linkbtn{display:flex;justify-content:space-between;align-items:center;border:1px solid #ccc;padding:15px 18px;font-size:16px;width:100%;text-align:left;background:#fff}
.tl{display:flex;margin:22px 0 8px}
.tl div{flex:1;text-align:center;font-size:12.5px;position:relative;color:var(--grey)}
.tl div:before{content:"";position:absolute;top:7px;left:-50%;right:50%;height:2px;background:#000}
.tl div:first-child:before{display:none}
.tl i{display:block;width:16px;height:16px;border-radius:50%;background:#000;margin:0 auto 8px;position:relative;z-index:1}
.steps{background:var(--soft);border-bottom:1px solid var(--line);padding:18px 0}
.steps .in{width:1100px;margin:0 auto;display:flex;align-items:center;gap:12px;font-size:14px;color:#444}
.steps .n{width:24px;height:24px;border-radius:50%;border:1px solid #999;display:inline-grid;place-items:center;font-size:12px;margin-right:8px}
.steps .n.on{background:#000;border-color:#000;color:#fff}.steps .n.done{background:#ddd;border-color:#ddd}
.steps .bar{width:44px;height:1px;background:#ccc}
.opt{position:relative;border:1px solid #ddd;padding:16px 20px;display:flex;gap:14px;align-items:flex-start;cursor:pointer;margin-bottom:10px;background:#fff}
.opt.on{outline:1.5px solid #000;outline-offset:-1px}
.opt b{display:block;font-size:16px;font-weight:500}
.opt span.s{display:block;font-size:14px;color:var(--grey);margin-top:2px}
.opt .note{margin-left:auto;font-size:14px;font-weight:500;white-space:nowrap}
.reasons{display:flex;flex-wrap:wrap;gap:8px}
.reasons button{border:1px solid #bbb;padding:9px 14px;font-size:14.5px;background:#fff}
.reasons button.on{outline:2px solid #000;outline-offset:-1px}
.blocked{border:1px solid #ddd;background:#f7f7f7;padding:18px}
.blocked b{display:block;font-size:16px;font-weight:600;margin-bottom:6px}
.blocked p{font-size:14px;color:#444;line-height:1.6}
.qr{width:170px;height:170px}
.foot{border-top:1px solid var(--line);margin-top:30px;padding:34px 56px;display:flex;gap:70px;font-size:14px}
.foot div{display:flex;flex-direction:column;gap:9px}
.foot b{font-weight:600}

/* walkthrough bar + modal */
.wbar{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);z-index:70;max-width:calc(100vw - 32px);background:rgba(20,20,20,.94);border-radius:22px;padding:6px 8px;display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:2px;font-family:var(--sans)}
.wbar button{white-space:nowrap;font-size:11px;font-weight:500;padding:7px 10px;border-radius:999px;color:#d8d8d8}
.wbar button.on{background:#fff;color:#111}
.wbar .sep{width:1px;height:18px;background:#555;margin:0 4px}
.wbar .pill{font-weight:600;padding:7px 12px;color:#fff;background:#555}
.wbar .pill.on{background:#fff;color:#000}
.mscrim{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:80;padding:30px}
.modal{width:520px;max-width:100%;background:#fff;padding:32px;position:relative;box-shadow:0 24px 60px rgba(0,0,0,.22)}
.modal .x{position:absolute;top:16px;right:18px;font-size:16px;color:#676869}
.modal h2{font-family:var(--serif);font-weight:400;font-size:30px;line-height:1.15;margin-bottom:12px}
.modal .intro{font-size:15px;color:#434343;line-height:1.6;margin-bottom:20px}
.modal .rows{display:flex;flex-direction:column;gap:14px;padding:18px;background:var(--soft)}
.modal .rows div{display:flex;gap:12px}
.modal .rows .ck{font-weight:700}
.modal .rows b{display:block;font-size:15px;font-weight:600}
.modal .rows span.s{display:block;font-size:13.5px;color:var(--grey);line-height:1.5}
.modal .fine{font-size:11px;color:#a4a5a5;line-height:1.6;margin-top:16px}
.modal .fine u{color:#565656}
.modal .bt{display:flex;justify-content:space-between;align-items:center;margin-top:20px}
.fade{animation:fd .2s ease}
@keyframes fd{from{opacity:.4}to{opacity:1}}
/* ===== Seel Worry-Free Purchase layer ===== */
:root{--seel:#1e1e1e;--seel-ink:#1e1e1e;--seel-bg:#f5f6f8;--seel-lilac:#e0e0e0;--ok:#1e1e1e;--cream:#f5f6f8}
.sv{font-family:var(--sans);color:#1e1e1e}
.sv .row{display:flex;justify-content:space-between}
.sl{font-family:var(--sans);font-weight:700;color:var(--seel);letter-spacing:-.02em}
.wfpn{font-family:var(--sans);font-weight:700;color:#000}
.wfpn sup{font-size:8px}
.pbs{font-family:Nunito,sans-serif;font-size:8.32px;font-weight:700;color:#565656;white-space:nowrap}
.badge2{display:inline-flex;align-items:center;gap:6px;background:var(--soft);color:var(--ink);font-size:12px;font-weight:500;padding:4px 9px;border-radius:2px;margin-bottom:6px;font-family:var(--sans)}
.wl{display:flex;gap:13px;align-items:flex-start;margin-top:14px;padding:16px 18px;border:1px solid var(--line);background:#fff;font-family:var(--sans);line-height:1.5}
.wl .ic{flex:0 0 32px;width:32px;height:32px;border-radius:999px;background:var(--seel-bg);color:var(--seel);display:flex;align-items:center;justify-content:center}
.wl .t{font-size:13.5px;display:flex;align-items:baseline;gap:5px;flex-wrap:wrap}
.wl .d{font-size:12.5px;color:#3f4041;margin-top:3px}
.wl .d a{color:var(--grey);text-decoration:underline;cursor:pointer}
.wrow{padding:16px 0;border-bottom:1px solid var(--line);display:grid;grid-template-columns:1fr auto;gap:10px;font-family:var(--sans)}
.optin{display:grid;grid-template-columns:20px 1fr;gap:12px;align-items:start;margin-top:12px;padding:16px 18px;border-radius:2px;cursor:pointer;font-family:var(--sans);border:1px solid #d6d2c9;background:#fff;transition:.15s}
.optin.on{border-color:var(--seel);background:var(--seel-bg)}
.optin .cb{width:18px;height:18px;border-radius:3px;border:1.5px solid #d6d2c9;background:#fff;display:flex;align-items:center;justify-content:center;margin-top:1px}
.optin.on .cb{background:var(--seel);border-color:var(--seel)}
.optin .t{font-size:14.5px;display:flex;align-items:baseline;gap:5px;flex-wrap:wrap}
.optin .d{font-size:13px;color:#767676;margin-top:4px;line-height:1.5}
.optin .d a{color:var(--seel);text-decoration:underline;cursor:pointer}
.wbox{border:1px solid var(--line);background:var(--soft);border-radius:2px;padding:16px 18px;margin-top:18px;font-family:var(--sans)}
.wbox.plain{background:#fff;border-color:var(--line)}
.wbox .h{display:flex;gap:10px;align-items:center;font-size:14.5px;font-weight:700;color:#000}
.wbox .h .ic{color:var(--seel);display:flex}
.wbox p{font-size:13.5px;color:#3f4041;line-height:1.55;margin-top:6px}
.wbox .ft{display:flex;justify-content:space-between;align-items:center;margin-top:10px;font-size:11px;color:#8a8a8a}

    </div>
  </div>
  ${rcModal()}${rcSubmitted()}${rcDrawer()}
  </div>`;
};

function qr(){
  let s=11,c='',n=25,r=()=>(s=(s*9301+49297)%233280)/233280;
  for(let y=0;y<n;y++)for(let x=0;x<n;x++){const f=(x<7&&y<7)||(x>n-8&&y<7)||(x<7&&y>n-8);
    if(f){const lx=x>n-8?x-(n-7):x,ly=y>n-8?y-(n-7):y;if(lx===0||ly===0||lx===6||ly===6||(lx>1&&lx<5&&ly>1&&ly<5))c+=`<rect x="${x}" y="${y}" width="1" height="1"/>`;}
    else if(r()>.52)c+=`<rect x="${x}" y="${y}" width="1" height="1"/>`;}
  return `<svg class="qr" viewBox="-1 -1 27 27" fill="#000"><rect x="-1" y="-1" width="27" height="27" fill="#fff"/>${c}</svg>`;
}

/* ---------- Worry-Free Purchase "Learn more" modal (compact, Vestiaire-styled) ---------- */
function modal(){
  return `<div class="mscrim" onclick="closeModal()"><div class="modal fade" onclick="event.stopPropagation()">
    <button class="x" onclick="closeModal()">✕</button>
    <h2>Worry-Free Purchase for ${money(P.wfp)}</h2>
    <p class="intro">Most items on Vestiaire Collective come from individual sellers and can't be returned for a change of mind. The only option is to relist, with a processing fee after 72 hours. Added to your order, Worry-Free Purchase makes this item returnable.</p>
    <div class="rows">
      ${LM_FACTS.map(([b,t])=>`<div><span class="ck">✓</span><span><b>${b}</b>${t?`<span class="s">${t}</span>`:''}</span></div>`).join('')}
    </div>
    <p class="fine">Administered by Seel, Inc. Priced at 5.5% of the item price. Coverage subject to the <u>full policy</u>.</p>
    <div class="bt"><button class="btn" style="font-size:15px;padding:12px 22px" onclick="acceptWfp()">${S.wfp?'Keep it on this order':'Add for '+money(P.wfp)}</button>${pby}</div>
  </div></div>`;
}

/* ---------- walkthrough bar ---------- */
const TABS = [
  {t:'Home',sc:'home'},{t:'Handbags',sc:'plp'},{t:'Product',sc:'pdp',drawer:false},{t:'Learn more',sc:'pdp',modal:true},{t:'Added to bag',sc:'pdp',drawer:true},
  {t:'Checkout · bag',sc:'bag'},{t:'Checkout · shipping',sc:'ship'},{t:'Checkout · payment',sc:'pay'},{t:'Confirmation',sc:'conf'},
  {t:'Coverage email',sc:'seelmail'},{t:'My orders',sc:'order'},{t:'Returns policy',sc:'policy'},
  {t:'Returns portal',sc:'seelportal'},{t:'Returns center',sc:'rc',rs:0},
  {t:'Return · start',sc:'rc',rs:9},{t:'Return · confirm',sc:'rc',rs:11},{t:'Return · label',sc:'rc',rs:12},
  {t:'Shipping claim',sc:'rc',rs:1,ct:'delivery'},{t:'Report an issue',sc:'rc',rs:1,ct:'item'}];
function tabOn(t){
  if(t.sc==='rc') return S.screen==='rc' && (S.rcStep===t.rs || (t.rs===1 && S.rcStep>=1 && S.rcStep<=6)) && (t.ct===undefined || S.claimType===t.ct) && !(t.rs===0 && S.rcStep);
  return S.screen===t.sc && (t.drawer===undefined||S.drawer===t.drawer) && (t.modal===undefined||S.modal===t.modal) && !(t.sc==='pdp'&&t.modal===undefined&&S.modal);
}
function bar(){
  return TABS.map((t,i)=>`<button class="${tabOn(t)?'on':''}" onclick="pickTab(${i})">${t.t}</button>`).join('') +
    `<span class="sep"></span><button class="pill ${S.wfp?'on':''}" onclick="toggleGlobal()">${S.wfp?'WFP added':'WFP not added'}</button>`;
}
function pickTab(i){
  const t=TABS[i]; const patch={drawer:!!t.drawer, modal:!!t.modal};
  if(['conf','seelmail','order','policy','seelportal','rc','portal','claim'].includes(t.sc)) patch.protectedOrder=S.wfp;
  if(t.sc==='pay'&&!S.pay) patch.pay='card';
  if(t.sc==='rc'){
    if(!S.wfp){ return go(t.rs===1&&t.ct==='item'?'claim':(t.rs>=9?'portal':'seelportal'),patch); }
    Object.assign(patch,{rcStep:t.rs, orderDrawer:false, rcConfirm:false});
    if(t.ct){ patch.claimType=t.ct; patch.claimReason=null; patch.rcMethod='card'; }
    if(t.rs>=9 && S.rcMethod==='keep') patch.rcMethod='card';
  }
  go(t.sc,patch);
}

/* ---------- actions ---------- */
function go(sc,extra){ Object.assign(S,{screen:sc,drawer:false,modal:false},extra||{}); render(); }
function render(keep){
  const y=window.scrollY;
  const app=document.getElementById('app'); app.innerHTML=V[S.screen]();
  document.getElementById('layer').innerHTML = S.modal?modal():'';
  document.getElementById('bar').innerHTML = bar();
  if(keep) window.scrollTo(0,y); else { window.scrollTo(0,0); app.classList.remove('fade'); void app.offsetWidth; app.classList.add('fade'); }
}
function addToBag(){ S.drawer=true; render(true); }
function toggleWfp(){ S.wfp=!S.wfp; S.protectedOrder=S.wfp; render(true); }
function toggleGlobal(){ S.wfp=!S.wfp; S.protectedOrder=S.wfp; if(!S.wfp){ S.rcStep=0; S.orderDrawer=false; } render(true); }
function openModal(e){ if(e){e.stopPropagation();e.preventDefault();} S.modal=true; render(true); }
function closeModal(){ S.modal=false; render(true); }
function acceptWfp(){ S.wfp=true; S.protectedOrder=true; S.modal=false; render(true); }
function checkoutWith(){ go('bag',{wfp:true,protectedOrder:true}); }
function checkoutWithout(){ go('bag',{wfp:false,protectedOrder:false}); }
function placeOrder(){ go('conf',{protectedOrder:S.wfp}); }
function rcGo(n){ S.rcStep=n; if(n===9||n===1){ S.rcSel=true; S.rcConfirm=false; } render(true); }
function rcClose(){ S.rcStep=0; render(true); }
function startClaim(type){ Object.assign(S,{claimType:type,claimReason:null,rcMethod:'card'}); rcGo(1); }
function finishReturn(){ Object.assign(S,{rcStep:0,refundIssued:true,orderDrawer:true}); render(true); }

/* scale the 1440px canvas to fit narrower windows */
function fit(){ const z=Math.min(1,window.innerWidth/1440); document.getElementById('canvas').style.zoom=z; }
window.addEventListener('resize',fit); fit();
render();
</script>
